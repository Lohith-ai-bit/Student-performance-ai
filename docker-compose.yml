services:
  postgres:
    image: postgres:16-alpine
    container_name: spa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_password}
      POSTGRES_DB: ${POSTGRES_DB:-student_performance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spa_user} -d ${POSTGRES_DB:-student_performance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spa-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spa_user}:${POSTGRES_PASSWORD:-spa_password}@postgres:5432/${POSTGRES_DB:-student_performance}
      REDIS_URL: redis://redis:6379/0
      ML_ARTIFACTS_DIR: /app/ml_artifacts
    volumes:
      - ./ml/artifacts:/app/ml_artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spa-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      FASTAPI_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spa-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spa_user}:${POSTGRES_PASSWORD:-spa_password}@postgres:5432/${POSTGRES_DB:-student_performance}
      REDIS_URL: redis://redis:6379/0
      ML_ARTIFACTS_DIR: /app/ml_artifacts
    volumes:
      - ./ml/artifacts:/app/ml_artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
