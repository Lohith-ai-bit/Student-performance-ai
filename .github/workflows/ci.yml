name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app ml --select E9,F63,F7,F82 --ignore E402
      - name: Type-check core (mypy-lite via compileall)
        run: python -m compileall -q backend/app ml
      - name: Backend + ML tests
        working-directory: backend
        run: python -m pytest tests -q
        env:
          DATABASE_URL: sqlite://

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (includes TypeScript check + ESLint)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t edupredict-backend .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t edupredict-frontend ./frontend
